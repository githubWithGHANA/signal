version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    ECR_REPOSITORY: signal-app
    # IMAGE_TAG = CodeBuild build number (versioned); :latest also updated for compose default.

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY
      - 'echo "ECR URI: $ECR_URI"'
      - 'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com'
      - echo "$ECR_URI" > /tmp/ecr_uri.txt

  build:
    commands:
      - echo "Build started on $(date)"
      - chmod +x gradlew
      - ./gradlew app:bootJar --stacktrace
      - echo "Building Docker image..."
      - 'docker build -t $ECR_URI:$CODEBUILD_BUILD_NUMBER .'
      - 'docker tag $ECR_URI:$CODEBUILD_BUILD_NUMBER $ECR_URI:latest'

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - 'docker push $ECR_URI:$CODEBUILD_BUILD_NUMBER'
      - 'docker push $ECR_URI:latest'

      - echo "Packaging deployment bundle for CodeDeploy (signal-deploy / signal-dg)..."
      - mkdir -p bundle/scripts
      - cp docker-compose.yml bundle/
      - cp scripts/start-docker.sh scripts/stop-docker.sh scripts/validate.sh bundle/scripts/
      - chmod +x bundle/scripts/*.sh
      - cp appspec.yml bundle/
      - |
        cat > bundle/imagedefinitions.json <<EOF
        [
          {
            "name": "signal_app",
            "imageUri": "$(cat /tmp/ecr_uri.txt):latest"
          }
        ]
        EOF
      - echo "Image deployed -> $(cat /tmp/ecr_uri.txt):latest"
      - cd bundle && zip -r ../signal-deploy-bundle.zip . && cd ..
      - echo "Bundle contents:" && unzip -l signal-deploy-bundle.zip

artifacts:
  files:
    - signal-deploy-bundle.zip
  discard-paths: no

