version: 0.2

env:
  variables:
    IMAGE_NAME: signal-app
    ECR_REPO: 921829859169.dkr.ecr.ap-south-1.amazonaws.com/signal-app

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --region ap-south-1 ecr get-login-password | docker login --username AWS --password-stdin 921829859169.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo "Build started on `date`"
      - chmod +x gradlew
      - ./gradlew app:bootJar --stacktrace
      - echo "Building Docker image..."
      - docker build -t $IMAGE_NAME:${CODEBUILD_BUILD_NUMBER} .

  post_build:
    commands:
      - echo "Build completed on `date`"
      - "docker tag $IMAGE_NAME:${CODEBUILD_BUILD_NUMBER} $ECR_REPO:${CODEBUILD_BUILD_NUMBER}"
      - "docker tag $IMAGE_NAME:${CODEBUILD_BUILD_NUMBER} $ECR_REPO:latest"
      - "docker push $ECR_REPO:${CODEBUILD_BUILD_NUMBER}"
      - "docker push $ECR_REPO:latest"

cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'

artifacts:
  files:
    - 'app/build/libs/app-0.0.1-SNAPSHOT.jar'
    - 'appspec.yml'
    - 'scripts/**/*'
