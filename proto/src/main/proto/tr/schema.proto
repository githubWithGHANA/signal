  string expdate = 10;
  string opttype = 11;
  string stikeprc = 12;
  string buyavgprc = 13;
  string sellavgprc = 14;
  string bqty = 15;
  string sqty = 16;
  string fillbuyamt = 17;
  string fillsellamt = 18;
  string blQty = 19;
  string token = 20;
  string symbol = 21;
  string exchangeseg = 22;
  string fillbuyqty = 23;
  string fillsellqty = 24;
  string s_NetQtyPosConv = 25;
  string posflag = 26;
  string sSqrflg = 27;
  string discQty = 28;
  string priceNumerator = 29;
  string generalNumerator = 30;
  string priceDenomenator = 31;
  string generalDenomenator = 32;
  string companyname = 33;
  string realisedprofitloss = 34;
  string unrealisedprofitloss = 35;
  string type = 36;
  string uniqueKey = 37;
  string overallMtoM = 38;
  string multiplier = 39;
  string instrumentName = 40;
  string corporateAction = 41;
