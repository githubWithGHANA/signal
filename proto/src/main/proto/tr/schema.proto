  string netbuyamt = 53;
  string netbuyqty = 54;
  string netsellqty = 55;
  string CFBuyavgprc = 56;
  string CFsellavgprc = 57;
  string CFbuyqty = 58;
  string CFsellqty = 59;
  string FillbuyamtCF = 60;
  string FillsellamtCF = 61;
  string actid = 62;
  string NetBuyavgprc = 63;
  string NetSellavgprc = 64;
  string CFActualBAP = 65;
  string CFActualSAP = 66;
}

message PositionResponseStream {
  repeated PositionResponse positions = 1;
  string userId = 2;
}

// Define the PositionStreamRequest message for requesting position data from Service
message PositionStreamRequest {
  string type = 1;  // Type of data to filter (e.g., "position updates")
}

// Define the PositionService service for streaming position data
service PositionService {
  // Server-streaming RPC to stream position data to the client
  rpc StreamPositionData (PositionStreamRequest) returns (stream PositionResponseStream);
}

message MarginCheckLogin {
  string clientID = 1;
  string trToken = 2;
  string userSessionID = 3;
  string jSessionID = 4;
  string brokerName = 5;
  string branchId = 6;
  string accountId = 7;
  google.protobuf.BoolValue  cugUser = 8;
  string productAlias = 9;
}

message MarginCheckResponse {
  string clientID = 1;
  bool success = 2;
  string description = 3;
  string status = 4;
}

service MarginCheckService {
  // When user logs in, check if the user has sufficient margin
  rpc LoginMarginCheck (MarginCheckLogin) returns (MarginCheckResponse);
}

