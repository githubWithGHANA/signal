version: 0.0
os: linux

files:
  - source: /
    destination: /opt/signal

hooks:
  BeforeInstall:
    - location: scripts/stop-docker.sh
      timeout: 180
      runas: root

  AfterInstall:
    - location: scripts/start-docker.sh
      timeout: 180
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root