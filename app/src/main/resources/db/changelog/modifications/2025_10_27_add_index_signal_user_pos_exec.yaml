databaseChangeLog:
  - changeSet:
      id: add-index-signal-user-pos-exec-date
      author: mahir
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: 2025_10_27_add_index_signal_user_pos_exec
                tableName: signal
      changes:
        - createIndex:
            indexName: 2025_10_27_add_index_signal_user_pos_exec
            tableName: signal
            concurrently: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: position_type
              - column:
                  name: execution_type
              - column:
                  name: created_at
      rollback:
        - dropIndex:
            indexName: 2025_10_27_add_index_signal_user_pos_exec
            tableName: signal

