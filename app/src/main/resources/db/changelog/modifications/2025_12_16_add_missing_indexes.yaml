      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_app_user_log_info_user_id
                tableName: app_user_log_info
      changes:
        - createIndex:
            indexName: idx_app_user_log_info_user_id
